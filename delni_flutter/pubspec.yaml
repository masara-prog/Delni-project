name: delni_app
description: "تطبيق دلني للسياحة في ليبيا - واجهة السائح والمرشد"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  image_picker: ^1.2.1
  file_picker: ^11.0.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Brand fonts of the Delni platform (bundled, so Arabic renders the same offline)
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
        - asset: assets/fonts/Cairo-900.ttf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-400.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-500.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-700.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-800.ttf
          weight: 800
