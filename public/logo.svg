<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="archGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="roadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="duneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Group for Logo Icon -->
  <g transform="translate(0, 0)">
    <!-- Outer Location Pin Outline -->
    <path d="M 250 30 
             C 140 30, 70 110, 70 215 
             C 70 300, 160 380, 250 435 
             C 340 380, 430 300, 430 215 
             C 430 110, 360 30, 250 30 Z" 
          fill="none" 
          stroke="url(#pinGradient)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#dropShadow)" />

    <!-- Libyan Arch Inside Pin (Golden Arch) -->
    <path d="M 180 230 
             V 155 
             C 180 120, 320 120, 320 155 
             V 230 
             H 290 
             V 165 
             C 290 145, 210 145, 210 165 
             V 230 Z" 
          fill="url(#archGradient)" />

    <!-- Top Cap of Arch -->
    <rect x="170" y="145" width="160" height="16" rx="4" fill="url(#archGradient)" />
    <!-- Sun disk inside arch -->
    <circle cx="250" cy="115" r="22" fill="#fef08a" opacity="0.9" />

    <!-- Winding Dunes & Road at Bottom of Pin -->
    <path d="M 120 280 
             Q 180 230, 250 260 
             T 380 230 
             C 380 300, 310 380, 250 415 
             C 190 380, 120 300, 120 280 Z" 
          fill="url(#duneGradient)" />

    <!-- Curved Road overlay -->
    <path d="M 210 400 
             C 230 350, 210 300, 270 250 
             C 320 210, 340 250, 360 235
             C 320 310, 270 340, 240 405 Z" 
          fill="url(#roadGradient)" />

    <!-- Road Dashed Lane Line -->
    <path d="M 225 400 Q 230 330, 275 285" 
          fill="none" 
          stroke="#fef08a" 
          stroke-width="5" 
          stroke-dasharray="10 8" 
          stroke-linecap="round" />
  </g>

  <!-- Typography below pin -->
  <g transform="translate(250, 480)" text-anchor="middle" font-family="'Cairo', 'Tajawal', system-ui, sans-serif">
    <!-- Main title: دلني -->
    <text x="0" y="0" font-size="64" font-weight="900" fill="#0f172a" letter-spacing="-1">دلّني</text>
    <!-- Tagline: دليلك لاكتشاف ليبيا -->
    <text x="0" y="28" font-size="22" font-weight="700" fill="#0d9488" letter-spacing="0">دليلك لاكتشاف ليبيا</text>
  </g>
</svg>
